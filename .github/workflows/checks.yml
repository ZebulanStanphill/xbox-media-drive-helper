name: Checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libegl1 libopengl0
      - if: runner.os == 'macOS'
        run: brew install pkgconf
      - run: python -m pip install -e '.[gui]'
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build-native.py > native-build.log 2>&1
      - run: python scripts/test-native.py .native
      - run: python -m xbox_media_drive --json doctor
