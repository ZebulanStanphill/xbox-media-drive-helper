name: Checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libegl1 libopengl0
      - if: runner.os == 'macOS'
        run: brew install pkgconf
      - run: python -m pip install -e '.[gui]'
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
      # Quiet unless the build fails; then show why.
      - run: python scripts/build-native.py > native-build.log 2>&1 || { tail -n 200 native-build.log; exit 1; }
      - run: python scripts/test-native.py .native
      - run: python -m xbox_media_drive --json doctor
  appimage:
    # Build on the oldest glibc we support: the AppImage runs on anything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The build tools, the libraries Qt's offscreen platform loads, and FUSE for mounting the AppImage.
      - run: >
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl
          libegl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 fuse3 libfuse2
      - run: python scripts/build-linux.py
      - name: Smoke test (extract and run, as the user)
        run: |
          image=$(ls dist/linux/*.AppImage)
          export QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1
          "$image" --self-test
          "$image" --cli --json doctor
      - name: Smoke test (mounted, as root, like the pkexec helper)
        run: |
          image=$(ls "$PWD"/dist/linux/*.AppImage)
          sudo QT_QPA_PLATFORM=offscreen "$image" --cli --json doctor | tee doctor.json
          # The runner has no ntfsck of its own, so this must be the copy inside the AppImage.
          ! command -v ntfsck
          python -c "import json; d = json.load(open('doctor.json')); assert d['ntfsck_bundled'] and d['ntfsck'].endswith('/ntfsprogs-plus/ntfsck'), d"
      - name: Check a fresh NTFS image with the bundled ntfsck (as root)
        run: |
          image=$(ls "$PWD"/dist/linux/*.AppImage)
          truncate -s 64M fresh.img
          build/linux-native/sbin/mkntfs -F -Q -L "Xbox Test" fresh.img
          sha256sum fresh.img > fresh.sha256
          sudo "$image" --cli --json check "$PWD/fresh.img" | tee check.json
          python -c "import json; r = json.load(open('check.json')); assert r['verdict'] == 'clean' and r['bundled'] is True, r"
          sha256sum -c fresh.sha256
      - name: Empty a cleanly closed journal, then mount with the kernel's ntfs3 (as root)
        run: |
          image=$(ls "$PWD"/dist/linux/*.AppImage)
          sudo modprobe ntfs3 || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe ntfs3; }
          truncate -s 64M closed.img
          build/linux-native/sbin/mkntfs -F -Q -L "Xbox Test" closed.img
          # Restart pages from a real drive closed by an Xbox (client still listed, clean flag set), written with
          # the image-only test harness.
          cc -shared -fPIC -Ibuild/linux-native/include tests/image_session.c -Lbuild/linux-native/lib \
            -Wl,-rpath,"$PWD/build/linux-native/lib" -lntfs-3g -o harness.so
          python - <<'EOF'
          import ctypes as C
          data = bytearray(open("tests/fixtures/xbox-open-journal-restart-pages.bin", "rb").read())
          for page in (0, 4096):
              data[page + 62:page + 64] = (2).to_bytes(2, "little")
          shim = C.CDLL("./harness.so")
          shim.xmd_image_initialize.argtypes = [C.c_char_p, C.c_ulong]
          shim.xmd_image_initialize.restype = C.c_void_p
          shim.xmd_fixture_logfile.argtypes = [C.c_void_p, C.c_char_p, C.c_long]
          lib = C.CDLL("build/linux-native/lib/libntfs-3g.so")
          lib.ntfs_leave_file_security.argtypes = [C.c_void_p]
          api = shim.xmd_image_initialize(b"closed.img", 0x08000000)
          assert api and shim.xmd_fixture_logfile(api, bytes(data), len(data)) == 0
          assert lib.ntfs_leave_file_security(api)
          EOF
          sudo QT_QPA_PLATFORM=offscreen "$image" --cli --json inspect "$PWD/closed.img" | tee before.json
          python -c "import json; r = json.load(open('before.json')); assert r['journal'] == 'clean' and r['journal_empty'] is False, r"
          sudo mkdir -p /mnt/closed
          # For the record only: whether ntfs3 accepts the journal before it is emptied.
          if sudo mount -t ntfs3 -o loop closed.img /mnt/closed; then echo "ntfs3 mounted it before emptying"; sudo umount /mnt/closed; else sudo dmesg | grep ntfs3 | tail -3; fi
          sudo QT_QPA_PLATFORM=offscreen "$image" --cli --json empty-journal "$PWD/closed.img" --yes | tee emptied.json
          python -c "import json; r = json.load(open('emptied.json')); assert r['emptied'] is True, r"
          # A refused mount above may have set the dirty flag, which ntfs3 also refuses.
          sudo QT_QPA_PLATFORM=offscreen "$image" --cli --json clear-dirty "$PWD/closed.img" --yes
          sudo mount -t ntfs3 -o loop closed.img /mnt/closed
          echo written | sudo tee /mnt/closed/after-empty.txt
          sudo umount /mnt/closed
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/linux/*
