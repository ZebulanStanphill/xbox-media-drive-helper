<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3338"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6169"/>
      <stop offset="1" stop-color="#2b2f34"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd43f"/>
      <stop offset="1" stop-color="#0e7a0e"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- USB cable -->
  <path d="M512 290 L512 236 Q512 200 548 200 L700 200" fill="none" stroke="#1b1e21" stroke-width="30" stroke-linecap="round"/>
  <path d="M512 290 L512 236 Q512 200 548 200 L700 200" fill="none" stroke="#8a929b" stroke-width="18" stroke-linecap="round"/>
