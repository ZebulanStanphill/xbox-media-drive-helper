<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#7cf08a"/><stop offset="0.55" stop-color="#2fbf52"/><stop offset="1" stop-color="#0a7a2a"/></linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.45" stop-color="#202328"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7f9"/>
      <stop offset="0.5" stop-color="#c9d0d6"/>
      <stop offset="1" stop-color="#8e979f"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e33"/>
      <stop offset="1" stop-color="#55606a"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bf596"/>
      <stop offset="1" stop-color="#1fb446"/>
    </linearGradient>
    <linearGradient id="wand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f68"/>
      <stop offset="0.4" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d0d6"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffd83d"/>
      <stop offset="1" stop-color="#f0a400"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- Magic wand behind the stick; together they form an X -->
  <ellipse cx="520" cy="540" rx="70" ry="420" fill="url(#shadow)" transform="rotate(45 520 540)"/>
  <g transform="rotate(45 512 512)">
    <rect x="464" y="170" width="96" height="740" rx="48" fill="url(#wand)"/>
    <rect x="464" y="170" width="96" height="150" rx="48" fill="url(#cap)"/>
    <rect x="464" y="270" width="96" height="50" fill="url(#cap)"/>
    <rect x="464" y="800" width="96" height="110" rx="48" fill="url(#cap)"/>
    <rect x="464" y="800" width="96" height="50" fill="url(#cap)"/>
  </g>
  <circle cx="770" cy="254" r="150" fill="url(#glow)"/>
  <path d="M770 150 Q791 233 874 254 Q791 275 770 358 Q749 275 666 254 Q749 233 770 150 Z" fill="url(#spark)"/>
  <path d="M860 340 Q869 371 900 380 Q869 389 860 420 Q851 389 820 380 Q851 371 860 340 Z" fill="url(#spark)"/>
  <path d="M650 144 Q657 169 682 176 Q657 183 650 208 Q643 183 618 176 Q643 169 650 144 Z" fill="url(#spark)"/>
  <!-- Soft contact shadow (QtSvg has no blur filters, so it is a radial gradient) -->
  <!-- USB stick, slightly smaller so the wand shows on both sides -->
  <g transform="translate(512 512) scale(0.86) translate(-512 -512)">
  <ellipse cx="540" cy="560" rx="250" ry="460" fill="url(#shadow)" transform="rotate(-45 540 560)"/>
  <g transform="translate(-14 -14) rotate(-45 512 512)">
    <!-- USB-A connector -->
    <rect x="388" y="126" width="248" height="210" rx="26" fill="url(#metal)"/>
    <rect x="388" y="126" width="248" height="210" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"/>
    <rect x="440" y="182" width="54" height="54" rx="10" fill="url(#hole)"/>
    <rect x="530" y="182" width="54" height="54" rx="10" fill="url(#hole)"/>
    <!-- Black body -->
    <rect x="344" y="300" width="336" height="630" rx="92" fill="url(#body)"/>
    <rect x="350" y="306" width="324" height="618" rx="86" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <!-- USB trident, pointing toward the connector -->
    <g transform="translate(512 622) scale(1.22) translate(-512 -620)" fill="url(#glyph)" stroke="url(#glyph)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 772 V500" stroke-width="30" fill="none"/>
      <path d="M512 446 L556 512 H468 Z" stroke-width="14"/>
      <path d="M512 712 L436 650 V604" stroke-width="28" fill="none"/>
      <circle cx="436" cy="590" r="30" stroke="none"/>
      <path d="M512 660 L588 610 V584" stroke-width="28" fill="none"/>
      <rect x="560" y="534" width="56" height="56" rx="6" stroke="none"/>
      <circle cx="512" cy="776" r="40" stroke="none"/>
    </g>
  </g>
  </g>
</svg>
