  <rect x="776" y="182" width="44" height="36" rx="4" fill="#d9dee3"/>
  <rect x="788" y="192" width="20" height="16" rx="2" fill="#7c848c"/>
  <!-- External drive body -->
  <rect x="222" y="290" width="580" height="444" rx="70" fill="#0b0c0e" opacity="0.55" transform="translate(0 22)"/>
  <rect x="222" y="290" width="580" height="444" rx="70" fill="url(#drive)" stroke="#6c747d" stroke-width="6"/>
  <rect x="262" y="314" width="500" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
  <!-- Media badge -->
  <circle cx="512" cy="494" r="138" fill="#0b0c0e" opacity="0.35"/>
  <circle cx="512" cy="488" r="132" fill="url(#badge)"/>
  <path d="M478 418 L478 558 L590 488 Z" fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
  <!-- Vents and activity light -->
  <rect x="282" y="666" width="120" height="14" rx="7" fill="#1b1e21"/>
  <rect x="282" y="636" width="120" height="14" rx="7" fill="#1b1e21"/>
